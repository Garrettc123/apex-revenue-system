name: Engineering Control Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1-5'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: read
  actions: read

jobs:
  control-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run engineering intelligence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          FAIL_ON_SECURITY_REVIEW: 'false'
        run: python scripts/engineering_control_loop.py

      - name: Publish job summary
        if: always()
        run: cat engineering-reports/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload engineering report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-control-loop
          path: engineering-reports/
          retention-days: 14
