name: Engineering Control Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1-5'
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege: the token gets nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  control-loop:
    permissions:
      contents: read
      issues: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run engineering intelligence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          FAIL_ON_SECURITY_REVIEW: 'false'
        run: python scripts/engineering_control_loop.py

      - name: Publish job summary
        if: always()
        run: cat engineering-reports/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload engineering report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engineering-control-loop
          path: engineering-reports/
          retention-days: 14
