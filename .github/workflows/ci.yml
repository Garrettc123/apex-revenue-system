name: ADM CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [adm/ci-gate]

# Least privilege: the token gets nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          set -o pipefail
          python -m pip install -r requirements.txt pytest 2>&1 | tee pip-install.log

      - name: Verify imports
        run: |
          set -o pipefail
          {
            python -c "import flask; print('flask OK')"
            python -c "import requests; print('requests OK')"
            python -c "import main; print('main.py OK')"
            python -c "from core.phase12_api import register_phase12_routes; print('Phase 1-2 routes OK')"
          } 2>&1 | tee import-checks.log

      - name: Run test suite
        run: |
          set -o pipefail
          pytest tests/ -v --tb=short --junitxml=pytest-results.xml 2>&1 | tee pytest.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: adm-ci-diagnostics
          path: |
            pip-install.log
            import-checks.log
            pytest.log
            pytest-results.xml
          if-no-files-found: ignore
          retention-days: 7
