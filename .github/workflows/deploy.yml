name: GENESIS Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify all imports
        run: |
          python -c "import flask; print('flask OK')"
          python -c "from google import genai; print('google-genai OK')"
          python -c "import requests; print('requests OK')"
          python -c "import main; print('main.py OK')"

      - name: Run test suite
        run: pytest tests/ -v --tb=short

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -e
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set in GitHub Actions secrets."
            echo "1) Create a token at https://railway.app/account/tokens"
            echo "2) Repo Settings → Secrets and variables → Actions → New repository secret: RAILWAY_TOKEN"
            echo "3) Railway dashboard: New Project → Deploy from GitHub → Garrettc123/apex-revenue-system"
            echo "4) Service Settings → Generate Domain, then re-run this workflow."
            exit 1
          fi
          curl -fsSL https://railway.app/install.sh | sh
          export PATH="$HOME/.railway/bin:$PATH"
          railway --version || true
          # Prefer linked project; fall back to up from repo root
          railway up --detach || railway up --ci --detach || {
            echo "::error::railway up failed. Link the service: railway link (with RAILWAY_TOKEN) or connect the GitHub repo in Railway UI."
            exit 1
          }
          echo "Railway deploy requested."
